<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Number</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1edfa;--ink:#1d1840;--muted:#6b6591;--panel:#1b1740;--cell:#2d2863;--cell-ink:#d6d0fa;
  --lamp:#ffd23f;--lamp-ink:#2a1d00;
  --c0:#ff5a6a;--c1:#ff9f3f;--c2:#34cf9b;--c3:#4aa8ff;--c4:#b883ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b22;--ink:#f2efff;--muted:#a49ecf}}
:root[data-theme="dark"]{--bg:#0d0b22;--ink:#f2efff;--muted:#a49ecf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:"Bowlby One",Impact,sans-serif;font-weight:400;font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.5px}
.tools button{font:inherit;font-weight:800;border:2px solid var(--muted);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;margin-left:6px}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.stage{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,56px);padding:18px 0 14px;flex-wrap:wrap}
.ball{width:clamp(130px,24vw,190px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--bc,#8b84c9);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 6px var(--panel)}
.ball .n{font-family:"Bowlby One",Impact,sans-serif;font-size:clamp(52px,10vw,84px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.ball.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
#roll{font-family:"Bowlby One",Impact,sans-serif;font-size:clamp(26px,5vw,40px);padding:20px 46px;border:0;border-radius:999px;cursor:pointer;background:var(--lamp);color:var(--lamp-ink);box-shadow:0 8px 0 #b98a00;transition:transform .08s,box-shadow .08s}
#roll:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 #b98a00}
#roll:disabled{opacity:.7;cursor:default;transform:translateY(6px);box-shadow:0 2px 0 #b98a00}
.hist{text-align:center;min-height:30px;margin-bottom:12px;color:var(--muted)}
.board{background:var(--panel);border-radius:18px;padding:16px;display:grid;gap:6px;max-width:560px;margin:0 auto}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{display:grid;place-content:center;aspect-ratio:1;border-radius:50%;background:var(--cell);color:var(--cell-ink);font-weight:800;font-size:clamp(24px,5vw,44px);transition:background .08s,color .08s}
.cell.sel{background:var(--bc);color:#fff}
.cell.on{background:var(--lamp);color:var(--lamp-ink);box-shadow:0 0 0 3px #fff,0 0 22px 8px var(--lamp);transform:scale(1.18);position:relative;z-index:2}
.cell.win{animation:blink .45s steps(2) 8}
@keyframes blink{50%{background:#fff;color:#000}}
.cell.gone{background:#4a4857;color:#8c8999;box-shadow:none;animation:none}
.c0{--bc:var(--c0)}.c1{--bc:var(--c1)}.c2{--bc:var(--c2)}.c3{--bc:var(--c3)}.c4{--bc:var(--c4)}
.prize{display:flex;align-items:center;gap:18px;max-width:560px;margin:18px auto 0;background:var(--panel);color:#fff;border-radius:18px;padding:14px}
.prize[hidden]{display:none}
.prize img{width:clamp(110px,30vw,160px);aspect-ratio:1;border-radius:12px;background:#fff;object-fit:contain}
.pk{opacity:.8}
.pn{font-family:"Bowlby One",Impact,sans-serif;font-size:clamp(20px,4.5vw,30px);margin:4px 0 12px;line-height:1.1}
#claim{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--lamp);color:var(--lamp-ink)}
#claim[hidden]{display:none}
.stock{text-align:center;color:var(--muted);margin-top:16px;font-size:14px}
@media (max-width:640px){.cell{font-size:clamp(20px,7vw,30px)}}
@media (prefers-reduced-motion:reduce){.cell.win,.ball.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lucky Number</h1>
    <div class="tools"><button id="mute" aria-pressed="false">Sound on</button><button id="reset">Clear board</button></div>
  </header>
  <div class="stage">
    <div class="ball" id="ball" aria-live="polite"><div class="n">?</div></div>
    <button id="roll">ROLL</button>
  </div>
  <div class="hist" id="hist">Press ROLL to start</div>
  <div class="board" id="board" aria-label="Numbers 1 to 15"></div>
  <div class="prize" id="prize" hidden>
    <img id="pimg" alt="">
    <div><div class="pk">Number <b id="pnum"></b> wins</div><div class="pn" id="pname"></div><button id="claim">Prize claimed</button></div>
  </div>
  <div class="stock" id="stock"></div>
</div>

const MAP=[0,2,3,1,2,3,0,1,3,2,1,3,2,1,3,2];
const $=id=>document.getElementById(id);
const board=$('board'),cells=[],ball=$('ball'),btn=$('roll'),hist=$('hist'),prizeEl=$('prize'),claimBtn=$('claim');
const row=document.createElement('div');row.className='row';
for(let n=1;n<=15;n++){const c=document.createElement('div');c.className='cell c'+((n-1)%5);c.textContent=n;cells[n]=c;row.appendChild(c)}
board.appendChild(row);

let claimed=new Set(),busy=false,cur=0,pending=0;
try{JSON.parse(localStorage.getItem('luckyClaimed')||'[]').forEach(n=>claimed.add(n))}catch(e){}
function save(){try{localStorage.setItem('luckyClaimed',JSON.stringify([...claimed]))}catch(e){}}
function refresh(){
  for(let n=1;n<=15;n++)cells[n].classList.toggle('gone',claimed.has(n));
  const left=PR.map((p,i)=>p.q-[...claimed].filter(n=>MAP[n]===i).length);
  $('stock').textContent='Prizes left: '+PR.map((p,i)=>p.n+' '+left[i]).join(' · ');
  if(!busy){
    const full=claimed.size>=15;btn.disabled=full;btn.textContent=full?'FULL':'ROLL';
    if(full)hist.textContent='All prizes claimed. Tap Clear board to start again.';
  }
}

/* sound */
let ctx=null,muted=false;
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,d,type,vol,when){
  if(!ctx||muted)return;
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+(when||0);
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.03);
}
function tick(p,tense){
  if(tense){tone(520+p*500,.35,'triangle',.22);tone(1040+p*1000,.25,'sine',.08)}
  else tone(900-p*450,.05,'square',.07);
}
function fanfare(){
  [523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.22,i*.12));
  [1047,1319,1568].forEach((f,i)=>tone(f,.9,'sine',.16,.5+i*.02));
  [784,988,1175,1568].forEach((f,i)=>tone(f,.25,'square',.06,.9+i*.09));
}

/* roll */
function light(n){
  if(cur)cells[cur].classList.remove('on');
  cells[n].classList.add('on');cur=n;
  ball.style.setProperty('--bc','#8b84c9');ball.querySelector('.n').textContent=n;
}
function roll(){
  if(busy)return;
  const pool=[];for(let n=1;n<=15;n++)if(!claimed.has(n))pool.push(n);
  if(!pool.length)return;
  ac();busy=true;btn.disabled=true;btn.textContent='...';
  prizeEl.hidden=true;hist.textContent='';pending=0;
  document.querySelectorAll('.win,.sel').forEach(e=>e.classList.remove('win','sel'));
  const target=pool[Math.floor(Math.random()*pool.length)];
  const others=pool.filter(x=>x!==target),seq=[];let prev=cur;
  if(others.length){for(let i=0;i<34;i++){let n;do{n=others[Math.floor(Math.random()*others.length)]}while(n===prev&&others.length>1);seq.push(n);prev=n}}
  if(pool.length>=4){const ti=pool.indexOf(target),L=pool.length;[-2,1,-1].forEach(o=>seq.push(pool[(ti+o+L)%L]))}
  seq.push(target);
  let i=0;
  (function step(){
    const n=seq[i],p=i/(seq.length-1),last=i===seq.length-1,tense=i>=seq.length-4;
    light(n);tick(p,tense&&!last);
    if(last){finish(n);return}
    i++;setTimeout(step,45+Math.pow(p,3)*520+(tense?160:0));
  })();
}
function finish(n){
  cells[n].classList.remove('on');cells[n].classList.add('sel','win');cur=0;
  ball.style.setProperty('--bc','var(--c'+((n-1)%5)+')');ball.querySelector('.n').textContent=n;
  ball.classList.remove('pop');void ball.offsetWidth;ball.classList.add('pop');
  fanfare();try{navigator.vibrate&&navigator.vibrate([120,60,200])}catch(e){}
  const p=PR[MAP[n]];
  $('pimg').src=p.img;$('pnum').textContent=n;$('pname').textContent=p.n;claimBtn.hidden=false;prizeEl.hidden=false;
  hist.textContent='Give the prize, then tap "Prize claimed" to lock number '+n+'.';
  pending=n;busy=false;btn.disabled=false;btn.textContent='ROLL';
}
claimBtn.addEventListener('click',()=>{
  if(!pending)return;
  claimed.add(pending);save();
  cells[pending].classList.remove('sel','win');pending=0;
  claimBtn.hidden=true;$('pname').textContent+=' (claimed)';
  hist.textContent='Claimed. That number is now closed.';refresh();
});

/* controls */
btn.addEventListener('click',roll);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();roll()}});
$('mute').addEventListener('click',e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',muted)});
let armed=null;
$('reset').addEventListener('click',e=>{
  if(busy)return;
  if(!armed){e.target.textContent='Tap again to clear';armed=setTimeout(()=>{armed=null;e.target.textContent='Clear board'},3000);return}
  clearTimeout(armed);armed=null;e.target.textContent='Clear board';
  claimed.clear();save();pending=0;prizeEl.hidden=true;
  document.querySelectorAll('.win,.sel').forEach(x=>x.classList.remove('win','sel'));
  ball.style.setProperty('--bc','#8b84c9');ball.querySelector('.n').textContent='?';
  hist.textContent='Press ROLL to start';refresh();
});
refresh();
</script>
